name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter Android project
        run: |
          mkdir /tmp/athkar_app
          flutter create --platforms=android /tmp/athkar_app
          cp -r lib /tmp/athkar_app/
          cp pubspec.yaml /tmp/athkar_app/

      - name: Get dependencies
        working-directory: /tmp/athkar_app
        run: flutter pub get

      - name: Build APK
        working-directory: /tmp/athkar_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athkar-App-APK
          path: /tmp/athkar_app/build/app/outputs/flutter-apk/app-release.apk
